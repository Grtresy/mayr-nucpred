uncertainty_metrics = ["interval_coverage", "interval_width", "coverage_error_curve"]
bootstrap_unit = "connectivity_id"
bootstrap_replicates = 5000
random_seed = 2026080501

[baselines]
required = [
  "train_mean",
  "one_nearest_neighbor_morgan",
  "random_forest_standard_descriptors",
  "hist_gradient_boosting_standard_descriptors",
  "known_site_oracle_n",
  "automatic_site_plus_n",
]

[ablations]
required = [
  "without_xtb",
  "without_solvent",
  "without_site_type",
  "without_region_residual",
  "without_abstention",
  "single_seed_vs_ensemble",
]

[unseen_runtime]
input_contract = "canonical_smiles_plus_supported_pure_solvent_plus_formal_charge"
new_connectivity_geometry = "deterministic_G1_ETKDGv3_MMFF94s_then_UFF_fallback"
electronic_features = "fixed_geometry_GFN1_xTB_gas_and_ALPB"
candidate_types = [
  "atom",
  "atom_group",
  "bond",
  "delocalized_region",
  "transferable_h_group",
]
feature_failure_policy = "fail_closed"
unsupported_solvent_policy = "refuse"
applicability_policy = "distance_and_ensemble_disagreement_with_development_only_thresholds"
target_or_site_label_read = false

[external_confirmation]
design = "prospectively_assembled_after_final_model_freeze"
allow_previously_published_but_never_previously_inspected_sources = true
temporal_post_freeze_publication_only = false
model_or_threshold_update_after_search_begins = false
exclude_all_internal_connectivities = true
exclude_all_legacy_external_records = true
exclude_all_previously_inspected_sources = true
supported_pure_solvents_only = true
