freeze_all_candidate_scores_before_labels = true
selection_may_not_use_model_predictions = true
search_stop_rule = "frozen_query_matrix_completed_and_two_consecutive_snowball_rounds_add_no_eligible_source"
primary_n_metric = "MAE"
primary_site_metric = "exact_top1"
headline_r2_minimum_unique_connectivities = 30
headline_r2_minimum_n_range = 5.0
all_results_reported_regardless_of_direction = true

