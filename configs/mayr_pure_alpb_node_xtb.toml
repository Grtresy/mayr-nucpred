expected_records = 1136
expected_site_supervised_records = 1116
expected_h_group_records = 119
expected_multifragment_records = 40
minimum_complete_xtb10_fraction = 0.95

[fragment_policy]
name = "target_independent_known_spectator_stripping_v1"
monatomic_spectator_elements = ["Li", "Na", "K"]
monatomic_spectator_charge = 1
triflate_smiles = "O=S(=O)([O-])C(F)(F)F"
require_exactly_one_retained_fragment = true
selection_may_use_target_fields = false
single_fragment_sensitivity_expected_records = 1096

[split_policy]
parent_membership = "filter_parent_source_ids_to_fixed_1136_cohort"
group_identity = "post_spectator_stripping_model_canonical_smiles"
overlap_repair = "move_complete_overlapping_group_to_parent_majority_side"
tie_break = "train"
repair_may_use_target_fields = false

[geometry]
name = "G1"
method = "ETKDGv3"
conformer_count = 20
random_seed = 20260724
prune_rms_threshold_angstrom = 0.25
enforce_chirality = true
use_small_ring_torsions = true
use_macrocycle_torsions = true
primary_force_field = "MMFF94s"
fallback_force_field = "UFF"
allow_force_field_fallback = true
force_field_max_iterations = 1000
require_force_field_convergence = true
coordinate_precision_decimals = 10
geometry_optimization_with_xtb = false
unsupported_force_field_policy = "retain_record_and_mask_all_xtb_features"

[xtb]
archive_path = "reference/Ree2025/xtb-6.7.0-linux-x86_64.tar.xz"
archive_sha256 = "612c09f6bf85ffccb0e1ee4a62730de9032f64786b799525304eaa77a23d0dfe"
method = "GFN1-xTB"
gfn = 1
solvation_model = "ALPB"
geometry_optimization = false
fukui_mode = "vfukui"
ip_ea_mode = "vipea"
tce_reference_smiles = "N#CC(=C(C#N)C#N)C#N"
tce_reference_environment = "gas"
hartree_to_ev = 27.211386245988
fukui_minus_sign = -1.0

[features]
node_local = [
  "alpb_fukui_minus_density",
  "alpb_cm5",
  "alpb_condensed_softness",
  "alpb_condensed_nucleophilicity_index_ev",
]
global = [
  "alpb_homo_n_hartree",
  "alpb_softness_hartree_inverse",
  "alpb_vip_hartree",
  "alpb_nucleophilicity_index_hartree",
  "alpb_homo_n_minus_1_hartree",
  "delta_e_solv_hartree",
]
missing_value_policy = "fold_train_median_imputation_plus_availability_masks"
local_values_enter_before_message_passing = true
global_values_enter_after_site_pooling = true
oracle_site_fields_forbidden = true

[execution]
workers = 12
timeout_seconds = 600
preflight_max_records = 96

[quality_control]
