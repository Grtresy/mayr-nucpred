[model]
conditional_n_lineage = "publication_C2_to_E-B-N1_to_E-C-N3"
site_types = ["atom", "bond", "delocalized_region", "atom_group", "transferable_h_group"]
hidden_dim = 128
message_passing_layers = 4
node_embedding_dim = 16
edge_embedding_dim = 16
solvent_embedding_dim = 16
type_embedding_dim = 16
router_hidden_dim = 64
router_logit_weight = 1.0
router_base_adapter = "positive_per_type_affine_plus_context_residual_identity_initialized"
router_candidate_set_context = "typed_fused_mean_max_logmeanexp_count_base_max_topk.v1"
set_top_k = 3
dropout = 0.10
candidate_set_complexity = "O(n)_memory"
candidate_set_residual_contract = "context_type_internal_reordering_with_frozen_type_maximum"
direct_outputs = ["canonical_logit", "conditional_N"]
site_logit_design = "frozen_split_safe_v2_base_plus_trainable_joint_residual"
inner_base_source = "materialized_split_safe_publication_inner_ranker_plus_region_residual"
outer_development_base_source = "four_inner_oof_outer_selected_validity_logit"
outer_test_base_source = "label_blind_frozen_v2_canonical_logit"
site_ranker_projection = "forbidden_for_outer_three_member_ensemble"

[training]
batch_size_contexts = 8
maximum_epochs = 80
minimum_epochs = 16
early_stopping_patience = 12
minimum_validation_top1_delta = 0.0001
head_learning_rate = 0.00001
backbone_learning_rate_multiplier = 0.1
weight_decay = 0.0002
heads_only_warmup_epochs = 3
gradient_clip_norm = 5.0
outer_epoch_rule = "upper_median_of_four_inner_best_epochs"
site_type_context_balance_exponent = 0.5

[loss]
listwise_weight = 1.0
pairwise_weight = 1.0
evidence_bce_weight = 0.25
type_router_weight = 0.5
type_router_loss = "exact_endpoint_type_listwise_plus_balanced_reviewed_bce_pairwise.v1"
n_regression_weight = 1.0
pairwise_margin = 0.75
n_harm_multiplier = 1.0
n_harm_cap_quantile = 0.95

[type_router]
enabled = true
fit_role = "outer_development_inner_oof_only"
feature_contract = "morgan1024_context_physical_typed_candidate_set_structural.v3"
excluded_model_derived_features = ["conditional_n_seed_std"]
