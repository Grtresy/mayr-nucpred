device = "cuda:0"
outer_fold_count = 5
inner_fold_count = 4
initialization_seeds = [2026072601, 2026072602, 2026072603]
inner_conditional_n_ensemble_size = 1
outer_conditional_n_ensemble_size = 3
unknown_is_negative = false
candidate_softmax_used = false
no_site_class_used = false
outer_test_used_for_selection = false
endpoint_noncanonical_semantics = "not_the_reported_canonical_endpoint_in_this_exact_molecule_solvent_context_not_universal_non_nucleophile"

[dataset]
directory = "data/processed/mayr_site_n/mayr-site-n-20260805-v2"
manifest_path = "data/processed/mayr_site_n/mayr-site-n-20260805-v2/dataset_manifest.json"
